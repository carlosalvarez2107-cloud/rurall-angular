<main class="frutas-page">

  <section class="frutas-header">

    <div class="frutas-header-contenido">

      <h1>Frutas</h1>

      <p>
        "Cada fruto que llega a nuestra mesa lleva consigo el trabajo de una tierra,
        unas manos y una historia"
      </p>

      <p>Oferta de productores y fincas disponibles:</p>

    </div>

    <div class="frutas-header-imagen">
      <img
        src="/frutas.jpg"
        alt="Frutas colombianas"
      >
    </div>

  </section>

  <section class="oferta-fincas">

    @for (finca of fincas; track finca.nombre) {
      <article class="tarjeta-finca">

        <img
          [src]="finca.imagen"
          [alt]="'Imagen de ' + finca.nombre"
        >

        <div class="informacion-finca">
          <h2>{{ finca.nombre }}</h2>

          <p>
            <strong>Ubicación:</strong>
            {{ finca.ubicacion }}
          </p>

          <p>
            <strong>Puntuación:</strong>
            ⭐ {{ finca.puntuacion }}
          </p>
        </div>

      </article>
    }

  </section>

</main>
